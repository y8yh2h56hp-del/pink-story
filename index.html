<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="screen active" id="welcome">

<h1>🎉 مرحباً 🎉</h1>

<p>لديك دعوة خاصة ✨</p>

<button id="startBtn">
ابدأ المفاجأة 💝
</button>

</div>


<div class="screen" id="passwordPage">

<h2>🔒 أدخل الرمز</h2>

<input
id="password"
type="password"
placeholder="الرمز السري">

<button id="checkBtn">
دخول
</button>

<p id="error"></p>

</div>


<div class="screen" id="messagePage">

<h1>🎂 كل عام وأنت بخير 🎂</h1>

<p id="typing"></p>

<button id="nextBtn">
متابعة 💕
</button>

</div>


<div class="screen" id="giftPage">

<h1>🎁</h1>

<h2>اضغط على الهدية</h2>

<div id="gift">
🎁
</div>

<p id="giftText"></p>

</div>

<script src="script.js"></script>

</body>
</html>
