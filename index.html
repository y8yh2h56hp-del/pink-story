<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Journey 🎂</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>

<body>

    <!-- الخلفية -->
    <div class="background"></div>

    <!-- النجوم -->
    <div class="stars"></div>

    <!-- الفراشات -->
    <div id="butterflies"></div>

    <!-- القلوب -->
    <div id="hearts"></div>

    <!-- المشهد الأول -->
    <section id="scene1" class="scene active">

        <div class="glass">

            <h1>🎉 مرحباً بك 🎉</h1>

            <h2>لديك دعوة خاصة</h2>

            <p>

                اليوم ليس يوماً عادياً...

                <br><br>

                هناك مفاجأة جميلة بانتظارك.

                <br><br>

                هل أنت مستعد لبدء الرحلة؟

            </p>

            <button id="startBtn">

                🎀 ابدأ المفاجأة

            </button>

        </div>

    </section>

    <!-- المشهد الثاني -->

    <section id="scene2" class="scene">

        <div class="glass">

            <h1>🔐 رمز الدخول</h1>

            <p>

                لكل مفاجأة مفتاح...

                <br><br>

                أدخل الرمز.

            </p>

            <input
                type="password"
                id="password"
                placeholder="••••">

            <button id="checkBtn">

                دخول

            </button>

            <h3 id="message"></h3>

        </div>

    </section>

    <!-- المشهد الثالث -->

    <section id="scene3" class="scene">

        <div class="glass">

            <h1 id="typing"></h1>

            <button id="nextBtn">

                متابعة 🦋

            </button>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
